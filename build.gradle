plugins {
    id 'java'
    id 'application'
    // The Shadow plugin for creating the Fat JAR
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'org.clinpgx'
version = '1.0-SNAPSHOT'

// Replace this with your actual main class path
application {
    mainClass = 'org.clinpgx.ApiServer'
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Core NLP Logic
    implementation 'edu.stanford.nlp:stanford-corenlp:4.6.0'

    // Core NLP English Models (Required for tokenization/parsing)
    implementation 'edu.stanford.nlp:stanford-corenlp:4.6.0:models'

    // Logging implementation so you can see what CoreNLP is doing
    implementation 'org.slf4j:slf4j-simple:2.0.20'

    // HTTP API
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
}

// Configure the Shadow JAR task
shadowJar {
    archiveBaseName.set('clinpgx-ner-tool')
    archiveClassifier.set('')
    archiveVersion.set('')
}

// Ensure the JVM has enough memory when running via Gradle
tasks.withType(JavaExec).configureEach {
    jvmArgs = ['-Xmx4g']
}

// Set Java compatibility
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}