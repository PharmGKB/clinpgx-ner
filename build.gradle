plugins {
    id 'java'
    id 'application'
    // The Shadow plugin for creating the Fat JAR
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'org.clinpgx'
version = '1.0-SNAPSHOT'

// Replace this with your actual main class path
application {
    mainClass = 'org.clinpgx.ApiServer'
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for testing
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Core NLP tokenizer. The separate models artifact isn't needed: tokenization is rule-based.
    implementation 'edu.stanford.nlp:stanford-corenlp:4.6.0'

    // Logging implementation so you can see what CoreNLP is doing
    implementation 'org.slf4j:slf4j-simple:2.0.20'

    // HTTP API
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
}

// Configure the Shadow JAR task
shadowJar {
    archiveBaseName.set('clinpgx-ner-tool')
    archiveClassifier.set('')
    archiveVersion.set('')
}

// Regenerate the dictionary files from a name<TAB>type<TAB>id<TAB>preferred|alt dump of ClinPGx entities.
// Usage: ./gradlew buildMappings [-Pentities=path/to/dump.tsv]
tasks.register('buildMappings', JavaExec) {
    group = 'build'
    description = 'Builds src/main/resources dictionary files from an entity dump'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.clinpgx.MappingBuilder'
    args = [
            project.findProperty('entities') ?: 'mappings/clinpgx_entities.tsv',
            'src/main/resources'
    ]
}

// Both pipelines need about 50 MB of heap; leave headroom for large request bodies
tasks.withType(JavaExec).configureEach {
    jvmArgs = ['-Xmx512m']
}

// Set Java compatibility
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}